name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # Dummy values so the fail-fast config module (phase-00 §19, phase-01 §19)
      # validates without real secrets. None of these reach a real service: the unit
      # suite never opens a socket, and the integration suite overrides DATABASE_URL
      # with the Testcontainers instance it starts itself. Never `echo` these — CI must
      # not print resolved env values (phase-00 §13).
      NODE_ENV: test
      LOG_LEVEL: info
      DATABASE_URL: ${{ vars.DATABASE_URL }}
      INNGEST_EVENT_KEY: dummy_event_key
      INNGEST_SIGNING_KEY: dummy_signing_key
      PORT: "4000"
      FRONTEND_URL: http://localhost:3000
      GITHUB_OAUTH_CLIENT_ID: dummy_oauth_client_id
      GITHUB_OAUTH_CLIENT_SECRET: dummy_oauth_client_secret
      AUTH_SECRET: dummy_auth_secret_at_least_32_characters_long
      AUTH_URL: http://localhost:4000
      WORKER_PORT: "4500"
      # Phase 02 §19 — GitHub App (not the OAuth App above). GITHUB_APP_PRIVATE_KEY is
      # base64 of a throwaway PEM envelope; apps/api's config shape-checks it at boot
      # but never parses the key material, and no test opens a socket to GitHub. Note
      # that GitHub Actions *secrets* cannot start with GITHUB_ (reserved prefix) — the
      # real values must be stored under a different secret name and remapped here.
      GITHUB_APP_ID: "123456"
      GITHUB_APP_PRIVATE_KEY: LS0tLS1CRUdJTiBSU0EgUFJJVkFURSBLRVktLS0tLQpkdW1teQotLS0tLUVORCBSU0EgUFJJVkFURSBLRVktLS0tLQ==
      GITHUB_APP_SLUG: dummy-app-slug
      GITHUB_APP_WEBHOOK_SECRET: dummy_webhook_secret
      REDIS_URL: redis://localhost:6379
      # Phase 04 Prompt 5: the 10k-file/query-plan/unresolved-ratio perf suites are real
      # integration tests (apps/worker/tests/integration/), not skipped by a separate CI
      # job — but SKIP_PERF_TESTS=1 excludes just the two genuinely slow, machine-shape-
      # sensitive ones (the 5,000-file and 10,000-file synthetic generators) from every
      # CI run, matching the escape hatch those files already define for local iteration.
      # Their measured numbers are recorded once, by hand, in
      # docs/decisions/phase-04-log.md — re-running a wall-clock budget assertion against
      # a shared, variable-performance CI runner would be a flaky test, not a useful one.
      SKIP_PERF_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      # Would have caught the phase-04/phase-06 merge that landed with seventeen files
      # still carrying <<<<<<</>>>>>>> markers on main (docs/decisions/phase-05-log.md).
      # `^=======$` is deliberately NOT checked — that pattern also matches an ordinary
      # Markdown horizontal rule and would false-positive on docs/.
      - name: Reject unresolved merge conflict markers
        run: |
          if grep -rn --exclude-dir=node_modules --exclude-dir=.git \
               -e '^<<<<<<< ' -e '^>>>>>>> ' .; then
            echo "Unresolved merge conflict markers found."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # packages/db/src/generated is currently committed, so this is not strictly
      # required to compile — but regenerating makes CI fail loudly if the committed
      # client has drifted from schema.prisma, instead of testing a stale client.
      # Needs no database connection.
      - name: Generate Prisma client
        run: pnpm db:generate

      # Catches a one-sided relation (a model missing its back-relation field) at CI
      # time instead of as a downstream compile error — this is exactly what let
      # Repository's missing symbols/dependencies/pullRequests relations reach main.
      - name: Validate Prisma schema
        run: pnpm --filter @repo/db exec prisma validate

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Prompt 5, sub-task 5.6: this phase's leading named risk (plan.md §45, phase-04
      # §22) is "tree-sitter WASM vs. native binding differences across environments" —
      # pinning `web-tree-sitter` locally (Prompt 1) is not a proof it works on the
      # actual Linux CI/deploy environment, only on one developer's machine. This step
      # is that proof: load all three grammars and parse a real snippet of each
      # language, on this runner, right after the real build — failing loudly (a
      # thrown, uncaught exception exits non-zero) if the binding does not work here.
      - name: Verify tree-sitter grammars load on this runner
        working-directory: apps/worker
        run: |
          node -e '
            const { parseFile } = await import("./dist/indexing/parsing/adapters/typescript.adapter.js");
            const cases = [
              ["typescript", "check.ts", "export function check(x: number): number { return x + 1; }"],
              ["tsx", "check.tsx", "export function Check() { return <div>ok</div>; }"],
              ["javascript", "check.js", "export function check(x) { return x + 1; }"],
            ];
            for (const [lang, path, source] of cases) {
              const parsed = await parseFile(path, lang, source);
              if (parsed.parseState !== "OK" || parsed.symbols.length === 0) {
                throw new Error(`grammar check failed for ${lang}: parseState=${parsed.parseState}, symbols=${parsed.symbols.length}`);
              }
              console.log(`${lang}: OK (${parsed.symbols.length} symbol(s))`);
            }
          ' --input-type=module

      # Includes the boundary-fixture assertion (apps/api/src/lib/boundaries.test.ts),
      # which lints the deliberate Rule A/B/C violation fixtures and fails if any of
      # them stops being reported (phase-00 §14, §15).
      - name: Unit tests
        run: pnpm test:unit

      # Testcontainers starts its own Postgres and runs `prisma migrate deploy`
      # against it (apps/api/tests/integration/global-setup.ts, apps/worker's own
      # equivalent), proving migrations apply cleanly from an empty database
      # (phase-00 §15). Needs Docker, which ubuntu-latest provides.
      - name: Integration tests
        run: pnpm test:integration
