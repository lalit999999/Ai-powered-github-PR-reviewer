name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Dummy values so the fail-fast config module (phase-00 §19, phase-01 §19)
      # validates without real secrets. None of these reach a real service: the unit
      # suite never opens a socket, and the integration suite overrides DATABASE_URL
      # with the Testcontainers instance it starts itself. Never `echo` these — CI must
      # not print resolved env values (phase-00 §13).
      NODE_ENV: test
      LOG_LEVEL: info
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
      INNGEST_EVENT_KEY: dummy_event_key
      INNGEST_SIGNING_KEY: dummy_signing_key
      PORT: "4000"
      FRONTEND_URL: http://localhost:3000
      GITHUB_OAUTH_CLIENT_ID: dummy_oauth_client_id
      GITHUB_OAUTH_CLIENT_SECRET: dummy_oauth_client_secret
      AUTH_SECRET: dummy_auth_secret_at_least_32_characters_long
      AUTH_URL: http://localhost:4000
      WORKER_PORT: "4500"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # packages/db/src/generated is currently committed, so this is not strictly
      # required to compile — but regenerating makes CI fail loudly if the committed
      # client has drifted from schema.prisma, instead of testing a stale client.
      # Needs no database connection.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Includes the boundary-fixture assertion (apps/api/src/lib/boundaries.test.ts),
      # which lints the deliberate Rule A/B/C violation fixtures and fails if any of
      # them stops being reported (phase-00 §14, §15).
      - name: Unit tests
        run: pnpm test:unit

      # Testcontainers starts its own Postgres and runs `prisma migrate deploy`
      # against it (apps/api/tests/integration/global-setup.ts), proving migrations
      # apply cleanly from an empty database (phase-00 §15).
      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build
